seed: 42

models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -5.0
    max_log_std: 1.0
    initial_log_std: -0.7
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 512, 256]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 512, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: IPPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 6
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.012
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.003
  value_loss_scale: 1.5
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: True
  experiment:
    directory: "cooperative_g1_payload"
    experiment_name: "ippo_ablation"
    write_interval: 1000
    checkpoint_interval: 100000

trainer:
  class: SequentialTrainer
  timesteps: 30000000
  environment_info: log
