seed: 42
models:
  separate: true
  policy:
    class: TeammateAttentionPolicy
    clip_actions: false
    clip_mean_actions: false
    clip_log_std: true
    min_log_std: -5.0
    max_log_std: 1.0
    initial_log_std: -0.9
    token_dim: 128
    attention_heads: 4
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: STATES
      layers:
      - 768
      - 512
      - 256
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: MAPPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 6
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.012
  observation_preprocessor: null
  observation_preprocessor_kwargs: {}
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.003
  value_loss_scale: 1.5
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: true
  experiment:
    directory: /tmp/tmp.BM32h7fuSb/logs/skrl/cooperative_g1_payload
    experiment_name: 2026-08-29_20-26-08_mappo_torch_mappo
    write_interval: 240
    checkpoint_interval: 6000
trainer:
  class: SequentialTrainer
  timesteps: 48000
  environment_info: log
  close_environment_at_exit: false
