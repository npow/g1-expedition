[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooperative-beam-isaaclab"
version = "0.1.0"
description = "Variable-team Unitree G1 cooperative rescue-load tasks for Isaac Lab"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
livekit = ["livekit==1.1.15"]
voice = ["gymnasium>=1,<2", "livekit-agents[elevenlabs]==1.7.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"*_env_cfg.py" = ["RUF012"]
